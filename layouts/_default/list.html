{{ define "main" }}
<main>
    {{ partial "particles-js.html" }}
    <article>
        {{ partial "page-header.html" (dict "title" .Title "class" "py-16 text-5xl") }}
        {{ with .Content }}
        <div class="max-w-2xl px-6 mx-auto mt-6 prose dark:prose-invert dark:text-white">
            {{- . -}}
        </div>
        {{ end }}
        {{ partial "posts-template.html" . }}
    </article>
    <div class="max-w-xl mx-auto my-16">
        {{ partial "pagination" . }}
    </div>
</main>
{{ end }}
